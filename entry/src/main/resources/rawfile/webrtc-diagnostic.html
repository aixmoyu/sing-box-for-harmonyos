<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC 网络检测</title><style>body{font:16px system-ui;background:#f6f7fb;color:#182033;margin:20px}button{padding:12px 22px;border:0;border-radius:16px;background:#dce5ff;font-size:16px}section{background:#fff;padding:16px;border-radius:18px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;word-break:break-all}table{width:100%;font-size:13px}.warn{color:#8b4a00}</style><h2>WebRTC 网络检测</h2><p>区分浏览器公开的本机候选与 STUN 获得的出口。没有候选不等于已证明安全；结果只代表当前浏览器和网络。</p><button id="run">开始检测</button><section id="state">未开始</section><section><b>HTTPS 出口</b><pre id="ips">未检测</pre></section><section><b>ICE 候选</b><table><thead><tr><th>服务器</th><th>类型</th><th>地址</th></tr></thead><tbody id="rows"></tbody></table></section><section><b>判读</b><p>host：浏览器枚举的接口地址，公网 IPv6 仍可能被网页读取。srflx：由 STUN 获得的映射地址，需与预期代理出口比较。未得到 srflx 可能是拦截、服务器不可达或浏览器限制，不能单独作为防泄漏成功证明。</p></section><details><summary>本次报告</summary><pre id="report"></pre></details><script>
const servers=['stun:stun.l.google.com:19302','stun:stun.cloudflare.com:3478','stun:stun.hitv.com:3478'];let running=false;
async function detect(){if(running)return;running=true;const report={version:1,startedAt:new Date().toISOString(),secureContext:window.isSecureContext,rtcSupported:typeof RTCPeerConnection==='function',exits:{},tests:[],userAgent:navigator.userAgent};const state=document.getElementById('state'),rows=document.getElementById('rows');rows.replaceChildren();state.textContent='检测中，最多约 15 秒…';document.getElementById('run').disabled=true;
const fetchIp=async(key,url)=>{try{const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(7000)});if(!r.ok)throw Error();const d=await r.json();report.exits[key]=String(d.ip||'');}catch(_){report.exits[key]='不可达或不支持';}document.getElementById('ips').textContent=JSON.stringify(report.exits,null,2);};
const ice=async(url)=>{const result={server:url,candidates:[],complete:false,error:''};report.tests.push(result);if(!report.rtcSupported){result.error='浏览器未开放 WebRTC，无法判断';return;}let pc;try{pc=new RTCPeerConnection({iceServers:[{urls:url}],iceCandidatePoolSize:0});await new Promise(async(resolve)=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);pc.close();resolve();};const timer=setTimeout(finish,12000);pc.onicecandidate=e=>{if(!e.candidate){result.complete=true;finish();return;}const c=e.candidate,tokens=c.candidate.split(/\s+/),type=c.type||tokens[tokens.indexOf('typ')+1]||'unknown',address=c.address||tokens[4]||'';const item={type,address,protocol:c.protocol||tokens[2]||'',relatedAddress:c.relatedAddress||''};if(!result.candidates.some(x=>JSON.stringify(x)===JSON.stringify(item))){result.candidates.push(item);const tr=document.createElement('tr');for(const value of[url,type,address]){const td=document.createElement('td');td.textContent=value;tr.append(td);}rows.append(tr);}};pc.onicecandidateerror=e=>{result.error='STUN 错误 '+String(e.errorCode||'');};try{pc.createDataChannel('diagnostic');await pc.setLocalDescription(await pc.createOffer());}catch(_){result.error='无法采集候选';finish();}});}catch(_){result.error='无法创建 WebRTC 实例';}finally{if(pc)pc.close();}};
try{await Promise.all([fetchIp('ipv4','https://api.ipify.org?format=json'),fetchIp('ipv6','https://api6.ipify.org?format=json'),...servers.map(ice)]);report.completedAt=new Date().toISOString();state.textContent=report.rtcSupported?'检测完成，请按候选类型判读；本页不自动宣称无泄漏。':'浏览器不支持本检测，无法判断。';document.getElementById('report').textContent=JSON.stringify(report,null,2);if(location.protocol==='http:'&&location.hostname==='127.0.0.1'){await fetch('/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)}).catch(()=>{});}}finally{running=false;document.getElementById('run').disabled=false;}}
document.getElementById('run').onclick=detect;if(new URLSearchParams(location.search).has('auto'))detect();
</script></html>
